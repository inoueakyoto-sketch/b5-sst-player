<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>B5 SST Player</title><link rel="stylesheet" href="styles.css"></head>
<body class="library-open">
<section id="library" class="player-library"><div class="library-wrap"><div class="library-head"><div><div class="eyebrow">B5 SST PLAYER</div><h1 class="library-title">SST ストーリー</h1><p class="library-sub">Google Drive などからダウンロードした <code>.sststory</code> を、ひつようなときだけついかしてつかいます。</p></div><div class="library-actions"><button id="importBtn" class="library-btn" type="button">＋ ストーリーをついか</button><input id="storyFile" type="file" accept=".sststory,application/zip,application/octet-stream" hidden></div></div><div id="status" class="library-status" aria-live="polite"></div><div id="storyList" class="story-list"></div><div id="empty" class="empty-library hidden-shell">まだストーリーがありません。<br>「ストーリーをついか」から、ダウンロードした <code>.sststory</code> をえらんでください。</div><div class="library-help">ストーリーパックをよみこむと、B5 SSTのガードレールをじどうでチェックします。HTMLやJavaScriptなどのプログラムはストーリーパックにはいれられません。よみこんだストーリーは、このたんまつにほぞんされます。</div></div></section>
<section id="gameWrap" class="game-frame-wrap hidden-shell"><iframe id="gameFrame" class="game-frame" title="B5 SST Player"></iframe></section>
<script src="vendor/jszip.min.js"></script><script src="ruby.js"></script><script src="story-loader.js"></script><script src="player.js"></script></body></html>
